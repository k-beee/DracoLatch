name: DracoLatch Verification Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest genvm-linter genlayer-test

    - name: Run Python unit and adversarial tests
      run: |
        python -m pytest -v tests/test_draco_latch.py

    - name: Lint DracoLatch contract
      run: |
        python -m genvm_linter.cli check contracts/draco_latch.py

    - name: Lint DracoSourceProbe contract
      run: |
        python -m genvm_linter.cli check contracts/draco_source_probe.py

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Frontend Dependencies & Build
      run: |
        cd frontend
        npm ci
        npm run build
